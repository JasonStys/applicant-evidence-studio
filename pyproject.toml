[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "applicant-evidence-studio"
version = "0.1.0"
description = "Advisory applicant review and portfolio coaching with traceable professional evidence"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.1", "uvicorn==0.38.0", "httpx==0.28.1", "pydantic==2.13.2", "pypdf==6.19.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.0.0", "ruff==0.14.0", "hypothesis==6.142.4"]

[project.scripts]
applicant-studio = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S105", "S106"]
"app/ingest.py" = ["S603"] # Fixed trusted Python worker, no shell; document is stdin data.
