name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: python scripts/code_index.py --check
      - run: python -m pytest --cov=app --cov-branch --cov-fail-under=85 --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/pytest.xml -W error::ResourceWarning
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && vars.AES_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
          retention-days: 3
  browser:
    name: Browser, accessibility and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm ci
      - run: npm run build
      - run: npm run test:comparison
      - run: npm run test:index-reader
      - run: node scripts/ts_index.mjs --check
      - run: npx prettier --check web tests/browser.spec.ts tests/private.spec.ts tests/comparison-domain.mjs tests/index-reader.mjs '*.ts' scripts/ts_index.mjs scripts/index_reader.mjs scripts/test_comparison.mjs scripts/native_ui_smoke.mjs index.html
      - name: Bound official Ubuntu mirror access on the disposable runner
        timeout-minutes: 1
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          # Preserve source suites, components and signature checks; avoid the stalled HTTP Azure mirror.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          # APT reads this leaf after the runner defaults; these are acquire, not APT::Acquire, keys.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install operating-system browser dependencies
        timeout-minutes: 10
        run: npx --no-install playwright install-deps chromium firefox webkit
      - name: Install the exact locked browsers
        timeout-minutes: 5
        run: npx --no-install playwright install chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:private
      - name: Repeat Firefox private-account regression in a new disposable service
        run: npm run test:private -- --project=firefox --repeat-each=2
      - name: Print bounded synthetic failure context without artifact uploads
        if: failure()
        run: python scripts/browser_diagnostics.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && vars.AES_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/
            dist/
          retention-days: 3
  audit-and-performance:
    name: Dependency audit and ranking benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: python scripts/benchmark.py
      - run: python -m pip_audit --local --format=json --output=artifacts/pip-audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && vars.AES_UPLOAD_CI_ARTIFACTS == 'true'
        with:
          name: audit-performance-evidence
          path: artifacts/
          retention-days: 3
  container:
    name: Non-root account-service image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: docker build -t applicant-private .
      - run: docker run --rm --env AES_PUBLIC_ORIGIN=https://studio.example --entrypoint python applicant-private -c "import os; from app.server import application; assert os.getuid() != 0; assert application().state.accounts.path.name == 'private-accounts.db'; print('Non-root ciphertext service verified')"
