# Jason Stys: QA-gated portable downloads; upload to a draft Release, not scarce Actions artifact storage.
name: Desktop release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-v0.3.0
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - name: Require passed validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/desktop_release_guard.py source
      - name: Create or resume an unpublished release for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 --json isDraft,targetCommitish > /tmp/release.json 2>/dev/null; then
            python scripts/desktop_release_guard.py draft
          else
            gh release create v0.3.0 --draft --target "$GITHUB_SHA" --title "Applicant Evidence Studio 0.3 — source-linked evidence comparison" --notes-file docs/releases/v0.3.0.md
            python scripts/desktop_release_guard.py draft
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip install pyinstaller==6.20.0
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build_desktop.py
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_desktop.py release/bin/ApplicantEvidenceStudio.exe
      - name: Smoke test Unix executable
        if: runner.os != 'Windows'
        run: python scripts/smoke_desktop.py release/bin/ApplicantEvidenceStudio
      - name: Verify and extract archive, then use its actual encrypted UI
        run: python scripts/portable_acceptance.py --built-directory release
      - name: Upload verified portable build and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/desktop_release_guard.py upload
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - name: Publish only after all three packaged binaries pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/desktop_release_guard.py publish
